# Test infrastructure for redb.Route integration tests.
# Usage:
#   docker compose -f docker-compose.tests.yml up -d
#   dotnet test --filter "Category=Integration"
#   docker compose -f docker-compose.tests.yml down -v

services:

  # ── RabbitMQ (AMQP 0-9-1) ──────────────────────────────────────────────────
  # Used by: redb.Route.Tests.RabbitMQ → localhost:5672, admin/admin
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: route-rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"     # AMQP 0-9-1
      - "15672:15672"   # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ActiveMQ Artemis (AMQP 1.0) ────────────────────────────────────────────
  # Used by: redb.Route.Tests.Amqp → localhost:5673, admin/admin
  artemis:
    image: apache/activemq-artemis:latest-alpine
    container_name: route-artemis
    ports:
      - "5673:5672"     # AMQP 1.0
      - "8161:8161"     # Web console
      - "61616:61616"   # Core/OpenWire
    environment:
      ARTEMIS_USER: admin
      ARTEMIS_PASSWORD: admin
      ANONYMOUS_LOGIN: "false"
    healthcheck:
      test: ["CMD", "/var/lib/artemis-instance/bin/artemis", "check", "node", "--url", "tcp://localhost:61616"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kafka (KRaft, 3 brokers) ────────────────────────────────────────────────
  # Used by: redb.Route.Tests.Kafka → localhost:29092,29094,29096
  kafka-1:
    image: apache/kafka:latest
    container_name: route-kafka-1
    hostname: kafka-1
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: route-test-cluster-001

  kafka-2:
    image: apache/kafka:latest
    container_name: route-kafka-2
    hostname: kafka-2
    ports:
      - "29094:29094"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,EXTERNAL://localhost:29094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: route-test-cluster-001

  kafka-3:
    image: apache/kafka:latest
    container_name: route-kafka-3
    hostname: kafka-3
    ports:
      - "29096:29096"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29096
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092,EXTERNAL://localhost:29096
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: route-test-cluster-001

  # ── Redis ───────────────────────────────────────────────────────────────────
  # Used by: redb.Route.Tests.Redis → localhost:6379
  redis:
    image: redis:7-alpine
    container_name: route-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── GreenMail (SMTP + IMAP + POP3) ─────────────────────────────────────────
  # Used by: redb.Route.Tests.Mail
  #   SMTP  → localhost:3025 (admin/admin)
  #   IMAP  → localhost:3143 (admin/admin)
  #   POP3  → localhost:3110 (admin/admin)
  #   SMTPS → localhost:3465
  #   IMAPS → localhost:3993
  #   POP3S → localhost:3995
  # Users must be provisioned via REST API: POST http://localhost:8080/api/user
  greenmail:
    image: greenmail/standalone:2.1.2
    container_name: route-greenmail
    ports:
      - "3025:3025"     # SMTP
      - "3110:3110"     # POP3
      - "3143:3143"     # IMAP
      - "3465:3465"     # SMTPS
      - "3993:3993"     # IMAPS
      - "3995:3995"     # POP3S
      - "8080:8080"     # REST API
    environment:
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0"
    healthcheck:
      test: ["CMD-SHELL", "echo | timeout 2 bash -c 'cat < /dev/null > /dev/tcp/localhost/3025' && echo | timeout 2 bash -c 'cat < /dev/null > /dev/tcp/localhost/3143'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── SFTP (OpenSSH) ─────────────────────────────────────────────────────────
  # Used by: redb.Route.Tests.Sftp → localhost:2222
  # User: testuser / secret, writable dir: /home/testuser/upload
  sftp:
    image: atmoz/sftp:latest
    container_name: route-sftp
    ports:
      - "2222:22"
    command: testuser:secret:::upload
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 22"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Mosquitto (MQTT 5.0) ────────────────────────────────────────────────────
  # Used by: redb.Route.Tests.MqttNet → localhost:11883
  # Anonymous access allowed (no auth).
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: route-mosquitto
    ports:
      - "11883:1883"     # MQTT
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    command: ["sh", "-c", "printf 'listener 1883\nallow_anonymous true\n' > /mosquitto/config/mosquitto.conf && /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf"]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 -W 3"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── IBM MQ Developer Edition ────────────────────────────────────────────────
  # Used by: redb.Route.Tests.IbmMq → localhost:1414
  #   Queue Manager: QM1
  #   Channel: DEV.APP.SVRCONN  (app / passw0rd)
  #   Queues: DEV.QUEUE.1 … DEV.QUEUE.5, DEV.DEAD.LETTER.QUEUE
  #   Web console: https://localhost:9443/ibmmq/console (admin / passw0rd)
  ibmmq:
    image: icr.io/ibm-messaging/mq:latest
    container_name: route-ibmmq
    hostname: ibmmq
    ports:
      - "1414:1414"     # MQ listener
      - "9443:9443"     # Web console (HTTPS)
    environment:
      LICENSE: accept
      MQ_QMGR_NAME: QM1
      MQ_APP_PASSWORD: passw0rd
      MQ_ADMIN_PASSWORD: passw0rd
      MQ_DEV: "true"
    volumes:
      - ibmmq-data:/mnt/mqm
    healthcheck:
      test: ["CMD-SHELL", "chkmqhealthy"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── MinIO (S3-compatible) ────────────────────────────────────────────────────
  # Used by: redb.Route.Tests.S3 → localhost:9000
  #   API:     http://localhost:9000 (minioadmin / minioadmin)
  #   Console: http://localhost:9001
  #   Default test bucket created on startup via mc client.
  minio:
    image: minio/minio:latest
    container_name: route-minio
    hostname: minio
    ports:
      - "9000:9000"     # S3 API
      - "9001:9001"     # Web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - minio-data:/data

  # Creates the default test bucket after MinIO is healthy.
  minio-init:
    image: minio/mc:latest
    container_name: route-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/test-bucket;
      exit 0;
      "

  # ── FTP/FTPS ────────────────────────────────────────────────────────────────
  # Used by: redb.Route.Tests.Ftp → localhost:21
  #   User: testuser / secret
  #   Passive ports: 21000-21010
  ftp:
    image: delfer/alpine-ftp-server:latest
    container_name: route-ftp
    ports:
      - "21:21"         # FTP control
      - "21000-21010:21000-21010"   # Passive data
    environment:
      USERS: "testuser|secret|/home/testuser|10000"
      ADDRESS: localhost
      MIN_PORT: 21000
      MAX_PORT: 21010
    volumes:
      - ./tests/docker/ftp/vsftpd.conf:/etc/vsftpd/vsftpd.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 21"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Elasticsearch ───────────────────────────────────────────────────────────
  # Used by: redb.Route.Tests.Elasticsearch → localhost:9200
  #   Single-node, security disabled for tests.
  elasticsearch:
    image: elasticsearch:8.17.0
    container_name: route-elasticsearch
    ports:
      - "9200:9200"     # HTTP API
      - "9300:9300"     # Transport
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Azure Service Bus Emulator ──────────────────────────────────────────────
  # Used by: redb.Route.Tests.AzureServiceBus → localhost:5672
  #   Official Microsoft emulator (GA). Requires Azurite for state storage.
  #   Connection string: "Endpoint=sb://localhost;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: route-azurite
    ports:
      - "10000:10000"   # Blob
      - "10001:10001"   # Queue
      - "10002:10002"   # Table
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:10000', r => process.exit(r.statusCode === 400 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5

  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: route-servicebus
    depends_on:
      azurite:
        condition: service_healthy
    ports:
      - "5300:5672"     # AMQP (remapped to avoid conflict with RabbitMQ on 5672)
    environment:
      SQL_SERVER: azurite
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "StrongP@ss1"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 5672"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── OpenLDAP ─────────────────────────────────────────────────────────────────
  # Used by: redb.Route.Tests.Ldap → localhost:389
  #   Admin DN:  cn=admin,dc=redb,dc=test
  #   Admin Pass: admin
  #   Base DN:   dc=redb,dc=test
  #   Test data: 5 users in ou=users, 2 groups in ou=groups
  openldap:
    image: osixia/openldap:1.5.0
    container_name: route-openldap
    hostname: openldap
    ports:
      - "389:389"       # LDAP
      - "636:636"       # LDAPS
    environment:
      LDAP_ORGANISATION: redb
      LDAP_DOMAIN: redb.test
      LDAP_ADMIN_PASSWORD: admin
      LDAP_READONLY_USER: "false"
      LDAP_TLS_VERIFY_CLIENT: never
    volumes:
      - openldap-data:/var/lib/ldap
      - openldap-config:/etc/ldap/slapd.d
      - ./tests/docker/ldap/seed.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/seed.ldif:ro
    command: --copy-service
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost -D cn=admin,dc=redb,dc=test -w admin -b dc=redb,dc=test -s base '(objectClass=*)' dn | grep -q 'dn:'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Firebase Emulators (Firestore + Auth) ───────────────────────────────────
  # Used by: redb.Route.Tests.Firebase.Integration
  #   Firestore:   localhost:8086 (set FIRESTORE_EMULATOR_HOST=localhost:8086)
  #   Auth:        localhost:9099 (set FIREBASE_AUTH_EMULATOR_HOST=localhost:9099)
  #   Emulator UI: http://localhost:4000
  #   Project:     demo-redb
  firebase-emulators:
    image: node:22-slim
    container_name: route-firebase-emulators
    hostname: firebase-emulators
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "8086:8086"     # Firestore
      - "9099:9099"     # Auth
      - "4000:4000"     # Emulator UI
    environment:
      FIRESTORE_EMULATOR_HOST: "0.0.0.0:8086"
      FIREBASE_AUTH_EMULATOR_HOST: "0.0.0.0:9099"
    entrypoint: >
      /bin/sh -c "
        apt-get update &&
        apt-get install -y --no-install-recommends ca-certificates wget &&
        rm -rf /var/lib/apt/lists/* &&
        wget -qO /tmp/jre.tar.gz 'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.7%2B6/OpenJDK21U-jre_x64_linux_hotspot_21.0.7_6.tar.gz' &&
        mkdir -p /opt/java && tar xzf /tmp/jre.tar.gz -C /opt/java --strip-components=1 && rm /tmp/jre.tar.gz &&
        export JAVA_HOME=/opt/java && export PATH=/opt/java/bin:$$PATH &&
        npm install -g firebase-tools &&
        mkdir -p /app && cd /app &&
        echo '{\"emulators\":{\"firestore\":{\"host\":\"0.0.0.0\",\"port\":8086},\"auth\":{\"host\":\"0.0.0.0\",\"port\":9099},\"ui\":{\"enabled\":true,\"host\":\"0.0.0.0\",\"port\":4000}}}' > firebase.json &&
        firebase emulators:start --project demo-redb --only firestore,auth
      "
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s

  # ── Mock OAuth2 Server (OIDC) ────────────────────────────────────────────────
  # Used by: redb.Identity federation tests
  #   Discovery: http://localhost:9199/default/.well-known/openid-configuration
  #   Authority: http://localhost:9199/default
  #   ClientId:  test-client / test-secret
  mock-oauth2:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    container_name: route-mock-oauth2
    hostname: mock-oauth2
    ports:
      - "9199:8080"
    environment:
      SERVER_PORT: 8080
      JSON_CONFIG: >
        {
          "interactiveLogin": true,
          "httpServer": "NettyWrapper",
          "tokenCallbacks": []
        }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/default/.well-known/openid-configuration || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Fake GCS Server (Firebase Storage) ──────────────────────────────────────
  # Used by: redb.Route.Tests.Firebase.Integration → http://localhost:4443
  #   Lightweight in-memory GCS emulator. Compatible with Google.Cloud.Storage.V1.
  fake-gcs:
    image: fsouza/fake-gcs-server:latest
    container_name: route-fake-gcs
    hostname: fake-gcs
    ports:
      - "4443:4443"
    command:
      - "-scheme"
      - "http"
      - "-host"
      - "0.0.0.0"
      - "-port"
      - "4443"
      - "-backend"
      - "memory"
      - "-public-host"
      - "localhost:4443"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4443/storage/v1/b || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mosquitto-data:
  mosquitto-log:
  ibmmq-data:
  minio-data:
  elastic-data:
  openldap-data:
  openldap-config:
