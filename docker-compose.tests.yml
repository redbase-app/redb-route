# Services for the redb.Route integration and interop tests.
#
# Every service has a profile, so a plain `docker compose up` starts nothing. Before a suite, start its profile;
# after it, remove everything with the containers' data (no service keeps data between runs):
#
#   bash tests/docker/gen-certs.sh                                   # once: test keys into tests/docker/.generated
#   docker compose -f docker-compose.tests.yml --profile kafka up -d --wait
#   dotnet test tests/redb.Route.Tests.Kafka
#   docker compose -f docker-compose.tests.yml --profile all --profile pgdb --profile msdb down -v --remove-orphans
#
# The tests run on the Docker host and reach every service on localhost:<host port>. Suites, profiles, ports and
# the variables the tests read are listed in tests/docker/README.md. Host names the tests use besides localhost:
#   127.0.0.1 kafka-k1 kafka-k2 kafka-k3   (Kafka TLS listeners: the broker certificate names only these)
#   127.0.0.1 pgdb msdb                    (Route.Tests.Sql and Quartz connection strings)
# Tests that call back into the test process (AS2 MDN, SOAP and gRPC clients) reach the host as
# host.docker.internal.
#
# Profiles: one per suite (see the README) plus "all" for every service except pgdb and msdb, which have their own
# profiles so that a host with its own Postgres and SQL Server on 5432 and 1433 never starts them.

name: redb-route-tests

x-kafka-broker: &kafka-broker
  image: apache/kafka:3.7.0
  profiles: [kafka, all]
  volumes:
    - ./tests/docker/.generated/kafka:/etc/kafka/secrets:ro
  tmpfs:
    - /var/lib/kafka/data:mode=1777
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server $$(hostname):19092 >/dev/null 2>&1 || /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server $$(hostname):19094 >/dev/null 2>&1 || /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server $$(hostname):19096 >/dev/null 2>&1"]
    interval: 10s
    timeout: 20s
    retries: 12
    start_period: 20s

x-kafka-env: &kafka-env
  KAFKA_PROCESS_ROLES: controller,broker
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-k1:9093,2@kafka-k2:9093,3@kafka-k3:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,SECURE:SASL_SSL,MTLS:SSL
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  # SECURE: SASL_SSL + SCRAM-SHA-512 (user redb, created by kafka-scram-init); MTLS: SSL, client certificate required.
  KAFKA_SSL_KEYSTORE_TYPE: PEM
  KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/broker.pem
  KAFKA_SSL_TRUSTSTORE_TYPE: PEM
  KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/ca.pem
  KAFKA_LISTENER_NAME_SECURE_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
  KAFKA_LISTENER_NAME_SECURE_SCRAM___SHA___512_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required;
  KAFKA_LISTENER_NAME_MTLS_SSL_CLIENT_AUTH: required
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

services:

  # ── RabbitMQ (AMQP 0-9-1) ─────────────────────────────────────────────────────────────────────────────────────────
  # Route.Tests.RabbitMQ: localhost:5672, admin/admin.
  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    container_name: route-rabbitmq
    hostname: rabbitmq
    profiles: [rabbitmq, all]
    ports:
      - "5672:5672"     # AMQP 0-9-1
      - "15672:15672"   # management
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    tmpfs:
      - /var/lib/rabbitmq:mode=1777
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── RabbitMQ with TLS, client-certificate (EXTERNAL) and OAuth2 logins ─────────────────────────────────────────────
  # Route.Tests.RabbitMQ RabbitMQTlsBrokerTests: AMQPS localhost:5671, AMQP 5674, management 15674,
  # REDB_RABBIT_TLS_CERTS=<repo>/redb.Route/tests/docker/.generated/rabbit-tls.
  rabbitmq-tls:
    image: rabbitmq:4.3-management-alpine
    container_name: route-rabbitmq-tls
    hostname: rabbitmq-tls
    profiles: [rabbitmq-tls, all]
    depends_on:
      rabbitmq-oauth2:
        condition: service_healthy
    ports:
      - "5671:5671"     # AMQPS
      - "5674:5672"     # AMQP (5672 is the plain broker's)
      - "15674:15672"   # management
    volumes:
      - ./tests/docker/.generated/rabbit-tls:/certs:ro
      - ./tests/docker/rabbit-tls/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./tests/docker/rabbit-tls/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./tests/docker/rabbit-tls/definitions.json:/etc/rabbitmq/definitions.json:ro
    tmpfs:
      - /var/lib/rabbitmq:mode=1777
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Token endpoint of the TLS broker's OAuth2 login: http://localhost:9299/default/token.
  rabbitmq-oauth2:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    container_name: route-rabbitmq-oauth2
    hostname: oauth2
    profiles: [rabbitmq-tls, all]
    depends_on:
      healthprobe-init:
        condition: service_completed_successfully
    ports:
      - "9299:8080"
    environment:
      SERVER_PORT: 8080
      JSON_CONFIG_PATH: /config/oauth2-config.json
    volumes:
      - ./tests/docker/.generated/rabbit-tls/oauth2-config.json:/config/oauth2-config.json:ro
    volumes_from:
      - healthprobe-init:ro
    healthcheck:
      test: ["CMD", "/probe/busybox", "wget", "-qO-", "http://127.0.0.1:8080/default/.well-known/openid-configuration"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── ActiveMQ Artemis (AMQP 1.0) ───────────────────────────────────────────────────────────────────────────────────
  # Route.Tests.Amqp: localhost:5673, admin/admin.
  activemq:
    image: apache/activemq-artemis:latest-alpine
    container_name: activemq
    user: root
    profiles: [amqp, all]
    environment:
      ARTEMIS_USER: admin
      ARTEMIS_PASSWORD: admin
      ARTEMIS_MIN_MEMORY: 512M
      ARTEMIS_MAX_MEMORY: 1024M
    # Only low host ports: OpenWire (61616) and STOMP (61613) fall in the Windows reserved range.
    ports:
      - "5673:5672"     # AMQP 1.0 (5672 is RabbitMQ's)
      - "8161:8161"     # console
      - "1883:1883"     # MQTT
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5672"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ── Kafka (KRaft, 3 brokers) ──────────────────────────────────────────────────────────────────────────────────────
  # Route.Tests.Kafka: plain localhost:29092,29094,29096; KafkaTlsTests: SASL_SSL kafka-k1:29192/k2:29194/k3:29196,
  # mTLS kafka-k1:29292/k2:29294/k3:29296, REDB_KAFKA_TLS_DIR=<repo>/redb.Route/tests/docker/.generated/kafka.
  # EXTERNAL advertises localhost for host-run tests; the TLS listeners advertise kafka-kN, the names the broker
  # certificate carries; PLAINTEXT is the inter-broker listener inside the compose network.
  kafka-k1:
    <<: *kafka-broker
    container_name: kafka-k1
    hostname: kafka-k1
    ports: ["29092:29092", "29192:29192", "29292:29292"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092,SECURE://0.0.0.0:29192,MTLS://0.0.0.0:29292
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-k1:19092,EXTERNAL://localhost:29092,SECURE://kafka-k1:29192,MTLS://kafka-k1:29292

  kafka-k2:
    <<: *kafka-broker
    container_name: kafka-k2
    hostname: kafka-k2
    ports: ["29094:29094", "29194:29194", "29294:29294"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19094,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29094,SECURE://0.0.0.0:29194,MTLS://0.0.0.0:29294
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-k2:19094,EXTERNAL://localhost:29094,SECURE://kafka-k2:29194,MTLS://kafka-k2:29294

  kafka-k3:
    <<: *kafka-broker
    container_name: kafka-k3
    hostname: kafka-k3
    ports: ["29096:29096", "29196:29196", "29296:29296"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19096,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29096,SECURE://0.0.0.0:29196,MTLS://0.0.0.0:29296
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-k3:19096,EXTERNAL://localhost:29096,SECURE://kafka-k3:29196,MTLS://kafka-k3:29296

  # The SCRAM user of the SECURE listeners (redb / redb-secret, the test password KafkaTlsTests use). It stays up
  # after creating the user and reports healthy then, so `up --wait` returns only when the user exists.
  kafka-scram-init:
    image: apache/kafka:3.7.0
    container_name: kafka-scram-init
    profiles: [kafka, all]
    depends_on:
      kafka-k1: { condition: service_healthy }
      kafka-k2: { condition: service_healthy }
      kafka-k3: { condition: service_healthy }
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for i in $$(seq 1 60); do
          if /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka-k1:19092 --alter --entity-type users \
               --entity-name redb --add-config 'SCRAM-SHA-512=[iterations=8192,password=redb-secret]'; then
            touch /tmp/done; exec sleep infinity
          fi
          sleep 2
        done
        exit 1
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/done"]
      interval: 3s
      timeout: 3s
      retries: 60

  # ── Redis ─────────────────────────────────────────────────────────────────────────────────────────────────────────
  # Route.Tests.Redis, Cache, SignalR: localhost:6379, no password.
  redis:
    image: redis:8-alpine
    container_name: redis
    profiles: [redis, all]
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--protected-mode", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── GreenMail (SMTP, IMAP, POP3) ──────────────────────────────────────────────────────────────────────────────────
  # Route.Tests.Mail and the Identity SMTP tests: user admin/admin; SMTP 3025, POP3 3110, IMAP 3143, SMTPS 3465,
  # IMAPS 3993, POP3S 3995, HTTP API 8080 (the tests purge the mailboxes through it).
  greenmail:
    image: greenmail/standalone:2.1.2
    container_name: route-greenmail
    profiles: [mail, all]
    ports:
      - "3025:3025"
      - "3110:3110"
      - "3143:3143"
      - "3465:3465"
      - "3993:3993"
      - "3995:3995"
      - "8080:8080"
    environment:
      # hostname=0.0.0.0 binds every server to all interfaces (setup.test.all alone binds 127.0.0.1 in the container).
      # Each server has 2 s to start by default; on a loaded host SMTPS missed it and the HTTP API never came up.
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.startup.timeout=30000 -Dgreenmail.users=admin:admin@localhost"
    healthcheck:
      # The image has no nc, curl or wget; bash opens the ports. The HTTP API starts after every mail server.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3025 && exec 4<>/dev/tcp/127.0.0.1/3143 && exec 5<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ── SFTP ──────────────────────────────────────────────────────────────────────────────────────────────────────────
  # Route.Tests.Sftp: localhost:2222, testuser/secret, folder upload/.
  sftp:
    image: atmoz/sftp:latest
    container_name: route-sftp
    profiles: [sftp, all]
    ports:
      - "2222:22"
    command: testuser:secret:::upload
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/22"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Mosquitto (MQTT 5.0) ──────────────────────────────────────────────────────────────────────────────────────────
  # Route.Tests.MqttNet: localhost:11883, anonymous.
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: route-mosquitto
    profiles: [mqtt, all]
    ports:
      - "11883:1883"
    command: ["sh", "-c", "printf 'listener 1883\nallow_anonymous true\npersistence false\n' > /mosquitto/config/mosquitto.conf && /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf"]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 -W 3"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── IBM MQ Developer Edition ──────────────────────────────────────────────────────────────────────────────────────
  # Route.Tests.IbmMq: localhost:1414, queue manager QM1, channel DEV.APP.SVRCONN (app/admin), admin/admin;
  # console https://localhost:9443/ibmmq/console. tests/docker/ibmmq/redb-tests.mqsc adds what the tests use beyond
  # the image's developer objects (DEV.QUEUE.4/5, the temporary reply queue model, the DEV/ topic). The tag is pinned:
  # a new image is a deliberate bump, checked against that script. The image needs an x86-64-v3 CPU (AVX2).
  ibmmq:
    image: icr.io/ibm-messaging/mq:9.4.5.0-r2
    container_name: ibmmq
    hostname: ibmmq
    profiles: [ibmmq, all]
    ports:
      - "1414:1414"     # listener
      - "9443:9443"     # console
    environment:
      LICENSE: accept
      MQ_QMGR_NAME: QM1
      MQ_APP_PASSWORD: admin
      MQ_ADMIN_PASSWORD: admin
      MQ_DEV: "true"
    volumes:
      - ./tests/docker/ibmmq/redb-tests.mqsc:/etc/mqm/90-redb-tests.mqsc:ro
    healthcheck:
      test: ["CMD-SHELL", "chkmqhealthy"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

  # ── LocalStack (SQS + SNS) ────────────────────────────────────────────────────────────────────────────────────────
  # Route.Tests.Sqs: http://localhost:4566, test/test, us-east-1.
  localstack:
    image: localstack/localstack:3        # community: SQS/SNS free, no auth token
    container_name: redb-localstack
    profiles: [sqs, all]
    ports:
      - "4566:4566"
    environment:
      ACTIVATE_PRO: "0"
      SERVICES: sqs,sns
      DEBUG: "0"
      AWS_DEFAULT_REGION: us-east-1
      EAGER_SERVICE_LOADING: "1"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # ── S3-compatible store (RustFS) ──────────────────────────────────────────────────────────────────────────────────
  # Route.Tests.S3: localhost:9000, minioadmin/minioadmin; the suites create their own buckets.
  s3:
    image: rustfs/rustfs:1.0.3
    container_name: route-s3
    hostname: s3
    profiles: [s3, all]
    ports:
      - "9000:9000"     # S3 API
      - "9001:9001"     # console
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FTP / FTPS ────────────────────────────────────────────────────────────────────────────────────────────────────
  # Route.Tests.Ftp: localhost:21, testuser/secret, passive ports 21000-21010.
  ftp:
    image: delfer/alpine-ftp-server:latest
    container_name: route-ftp
    profiles: [ftp, all]
    ports:
      - "21:21"
      - "21000-21010:21000-21010"
    environment:
      USERS: "testuser|secret|/home/testuser|10000"
      ADDRESS: localhost
      MIN_PORT: 21000
      MAX_PORT: 21010
    # vsftpd refuses a config file root does not own, or one with CRLF lines, and with background=YES says nothing:
    # the file is mounted aside and written by root without the CRs. The image's script creates the users and then
    # runs the command it is given: vsftpd in the foreground (its own background start lost the daemon's pid).
    volumes:
      - ./tests/docker/ftp/vsftpd.conf:/config/vsftpd.conf:ro
    entrypoint:
      - /sbin/tini
      - --
      - sh
      - -c
      - >-
        tr -d '\r' < /config/vsftpd.conf | sed 's/^background=.*/background=NO/' > /etc/vsftpd/vsftpd.conf
        && chmod 0644 /etc/vsftpd/vsftpd.conf
        && exec /bin/start_vsftpd.sh vsftpd -opasv_min_port=21000 -opasv_max_port=21010 -opasv_address=localhost /etc/vsftpd/vsftpd.conf
    healthcheck:
      # 127.0.0.1: vsftpd listens on IPv4 only, and localhost resolves to ::1 in this image.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 21"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Elasticsearch ─────────────────────────────────────────────────────────────────────────────────────────────────
  # Route.Tests.Elasticsearch: localhost:9200, security off.
  elasticsearch:
    image: elasticsearch:8.17.0
    container_name: route-elasticsearch
    profiles: [elasticsearch, all]
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    tmpfs:
      - /usr/share/elasticsearch/data:mode=1777
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      # More than two minutes on a 2-CPU host; checks failing within start_period do not count.
      start_period: 180s

  # ── Azure Service Bus emulator (+ Azurite + SQL Edge) ─────────────────────────────────────────────────────────────
  # Route.Tests.AzureServiceBus: AMQP localhost:5300.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: route-azurite
    profiles: [servicebus, all]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:10000', r => process.exit(r.statusCode === 400 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5

  sqledge:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: route-sqledge
    profiles: [servicebus, all]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "StrongP@ss1"

  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: route-servicebus
    profiles: [servicebus, all]
    depends_on:
      azurite:
        condition: service_healthy
      sqledge:
        condition: service_started
      healthprobe-init:
        condition: service_completed_successfully
    ports:
      - "5300:5672"     # AMQP (5672 is RabbitMQ's)
    environment:
      SQL_SERVER: sqledge
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "StrongP@ss1"
    volumes_from:
      - healthprobe-init:ro
    healthcheck:
      test: ["CMD", "/probe/busybox", "nc", "-z", "127.0.0.1", "5672"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ── Health probe for distroless images ────────────────────────────────────────────────────────────────────────────
  # The Service Bus emulator and mock-oauth2-server images have no shell, nc or wget, so a CMD-SHELL check can never
  # run there. A static busybox, copied into this container's anonymous volume, is the probe they mount read-only;
  # the volume goes with `down -v`.
  healthprobe-init:
    image: busybox:musl
    container_name: route-healthprobe-init
    profiles: [servicebus, oauth2, rabbitmq-tls, all]
    command: ["cp", "/bin/busybox", "/probe/busybox"]
    volumes:
      - /probe

  # ── OpenLDAP ──────────────────────────────────────────────────────────────────────────────────────────────────────
  # Route.Tests.Ldap: localhost:389 (LDAPS 636), admin DN cn=admin,dc=redb,dc=test / admin, base dc=redb,dc=test.
  openldap:
    image: osixia/openldap:1.5.0
    container_name: route-openldap
    hostname: openldap
    profiles: [ldap, all]
    ports:
      - "389:389"
      - "636:636"
    environment:
      LDAP_ORGANISATION: redb
      LDAP_DOMAIN: redb.test
      LDAP_ADMIN_PASSWORD: admin
      LDAP_READONLY_USER: "false"
      LDAP_TLS_VERIFY_CLIENT: never
    volumes:
      - ./tests/docker/ldap/seed.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/seed.ldif:ro
    command: --copy-service
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost -D cn=admin,dc=redb,dc=test -w admin -b dc=redb,dc=test -s base '(objectClass=*)' dn | grep -q 'dn:'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Firebase emulators (Firestore + Auth), Storage (fake GCS) and the FCM echo ────────────────────────────────────
  # Route.Tests.Firebase: Firestore localhost:8086, Auth 9099, UI 4000, Storage 4443, FCM 18200. The tests set
  # FIRESTORE_EMULATOR_HOST and STORAGE_EMULATOR_HOST themselves.
  firebase-emulators:
    build: ./tests/docker/firebase
    image: redb-route-tests/firebase-emulators:15.35.0
    container_name: firebase-emulators
    hostname: firebase-emulators
    profiles: [firebase, all]
    ports:
      - "8086:8086"
      - "9099:9099"
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8086/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  fake-gcs:
    image: fsouza/fake-gcs-server:latest
    container_name: firebase-gcs
    hostname: firebase-gcs
    profiles: [firebase, all]
    ports:
      - "4443:4443"
    command: ["-scheme", "http", "-host", "0.0.0.0", "-port", "4443", "-backend", "memory", "-public-host", "localhost:4443"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4443/storage/v1/b || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Google ships no FCM emulator: this echo records messages:send calls (GET/DELETE /messages, GET /healthz).
  fcm-echo:
    build: ./tests/docker/fcm-echo
    image: redb-route-tests/fcm-echo:1
    container_name: fcm-echo
    hostname: fcm-echo
    profiles: [firebase, all]
    ports:
      - "18200:18200"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:18200/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Mock OAuth2 server (OIDC) ─────────────────────────────────────────────────────────────────────────────────────
  # redb.Identity federation tests: http://localhost:9199/default.
  mock-oauth2:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    container_name: route-mock-oauth2
    hostname: mock-oauth2
    profiles: [oauth2, all]
    depends_on:
      healthprobe-init:
        condition: service_completed_successfully
    ports:
      - "9199:8080"
    environment:
      SERVER_PORT: 8080
      JSON_CONFIG: '{"interactiveLogin": true, "httpServer": "NettyWrapper", "tokenCallbacks": []}'
    volumes_from:
      - healthprobe-init:ro
    healthcheck:
      test: ["CMD", "/probe/busybox", "wget", "-qO-", "http://127.0.0.1:8080/default/.well-known/openid-configuration"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Second-tier SQL providers ─────────────────────────────────────────────────────────────────────────────────────
  # Route.Tests.Sql E2E Tier2. Connection strings are fixed in the tests (E2E/Infrastructure/*E2EProvider.cs).
  # Firebird: 127.0.0.1:3050, SYSDBA/1, database /var/lib/firebird/data/route_sql.fdb.
  firebird:
    image: firebirdsql/firebird:5
    container_name: route-firebird
    profiles: [firebird, sql-tier2, all]
    ports:
      - "3050:3050"
    environment:
      FIREBIRD_ROOT_PASSWORD: "1"
      FIREBIRD_DATABASE: route_sql.fdb
      FIREBIRD_DATABASE_DEFAULT_CHARSET: UTF8
    healthcheck:
      test: ["CMD", "bash", "-c", "test -f /var/lib/firebird/data/route_sql.fdb && exec 3<>/dev/tcp/127.0.0.1/3050"]
      interval: 5s
      timeout: 5s
      retries: 30

  # MySQL: 127.0.0.1:3306, root/1, database route_sql.
  mysql:
    image: mysql:8.4
    container_name: route-mysql
    profiles: [mysql, sql-tier2, all]
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "1"
      MYSQL_DATABASE: route_sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 30

  # MariaDB: 127.0.0.1:3307, root/1, database route_sql.
  mariadb:
    image: mariadb:11
    container_name: route-mariadb
    profiles: [mariadb, sql-tier2, all]
    ports:
      - "3307:3306"
    environment:
      MARIADB_ROOT_PASSWORD: "1"
      MARIADB_DATABASE: route_sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Oracle Free: 127.0.0.1:1521/FREEPDB1, user rsql/Rsql2026 (test password).
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: route-oracle
    profiles: [oracle, sql-tier2, all]
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: "Rsql2026"
      APP_USER: rsql
      APP_USER_PASSWORD: "Rsql2026"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  # ── AS2 interop: OpenAS2 ──────────────────────────────────────────────────────────────────────────────────────────
  # Route.Tests.As2 As2InteropTests: AS2 receive 127.0.0.1:14080, async MDN receive 14081; the tests' own receivers
  # listen on the host (15081, 15082). AS2_INTEROP_CERTS=<repo>/redb.Route/tests/docker/.generated/as2/certs;
  # the message folders (.generated/as2/data) are shared with the tests.
  openas2:
    build: ./tests/docker/as2
    image: redb-route-tests/openas2:1
    container_name: as2-openas2
    profiles: [as2, all]
    ports:
      - "14080:10080"   # AS2 receive
      - "14081:10081"   # async MDN receive
    volumes:
      - ./tests/docker/.generated/as2/keystore/as2_certs.p12:/opt/openas2/config/as2_certs.p12:ro
      - ./tests/docker/.generated/as2/keystore/ssl_certs.jks:/opt/openas2/config/ssl_certs.jks:ro
      - ./tests/docker/.generated/as2/data:/opt/openas2/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/10080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ── gRPC interop: grpc-js echo server and clients ─────────────────────────────────────────────────────────────────
  # Route.Tests.Grpc GrpcInteropTests: 127.0.0.1:18100; the tests run the container's clients with
  # `docker exec grpc-echo`, which call back to host.docker.internal.
  # REDB_GRPC_CERTS=<repo>/redb.Route/tests/docker/.generated/grpc.
  grpc-echo:
    build: ./tests/docker/grpc
    image: redb-route-tests/grpc-echo:1
    container_name: grpc-echo
    profiles: [grpc, all]
    ports:
      - "18100:18100"
    volumes:
      - ./tests/docker/.generated/grpc:/app/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(18100, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ── SOAP interop: node-soap echo server and clients ───────────────────────────────────────────────────────────────
  # Route.Tests.Soap *InteropTests: 127.0.0.1:18060; the tests run the container's clients with `docker exec soap-echo`,
  # which call back to host.docker.internal. The encryption test hands its envelope and key over through /work:
  # SOAP_INTEROP_DIR=<repo>/redb.Route/tests/docker/.generated/soap.
  soap-echo:
    build: ./tests/docker/soap
    image: redb-route-tests/soap-echo:1
    container_name: soap-echo
    profiles: [soap, all]
    ports:
      - "18060:18060"
    volumes:
      - ./tests/docker/.generated/soap:/work:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:18060/echo?wsdl', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ── Web consoles (optional, no test needs them) ───────────────────────────────────────────────────────────────────
  redpanda-console:
    image: redpandadata/console:latest
    container_name: redpanda-console
    profiles: [ui, all]
    ports:
      - "8888:8080"
    environment:
      KAFKA_BROKERS: kafka-k1:19092,kafka-k2:19094,kafka-k3:19096

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    profiles: [ui, all]
    ports:
      - "5540:5540"

  ldapadmin:
    image: osixia/phpldapadmin:latest
    container_name: route-ldapadmin
    profiles: [ui, all]
    ports:
      - "8389:80"
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: openldap
      PHPLDAPADMIN_LDAP_CLIENT_TLS: "false"
      PHPLDAPADMIN_HTTPS: "false"

  # ── PostgreSQL and SQL Server ─────────────────────────────────────────────────────────────────────────────────────
  # Route.Tests.Core, Llm, Quartz, Sql: Postgres localhost:5432 (postgres, trust), SQL Server localhost:1433 (sa/1).
  # Own profiles, not in "all": a host that already serves 5432 and 1433 leaves them out.
  pgdb:
    image: postgres:18
    profiles: [pgdb]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_PASSWORD: "1"
      POSTGRES_DB: redb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  # The stock image accepts only a strong sa password at setup; msdb-init lowers it to the tests' "1" and creates
  # the redb database, and reports healthy when done. The msdb health check accepts either password.
  msdb:
    image: mcr.microsoft.com/mssql/server:2025-latest
    profiles: [msdb]
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Setup-Only-1"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 1 -Q 'SELECT 1' -b -o /dev/null || /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s

  msdb-init:
    image: mcr.microsoft.com/mssql/server:2025-latest
    profiles: [msdb]
    depends_on:
      msdb: { condition: service_healthy }
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        q() { /opt/mssql-tools18/bin/sqlcmd -C -S msdb -U sa -b "$$@"; }
        q -P 'Setup-Only-1' -Q "ALTER LOGIN sa WITH PASSWORD = '1', CHECK_POLICY = OFF, CHECK_EXPIRATION = OFF" 2>/dev/null || true
        q -P 1 -Q "IF DB_ID('redb') IS NULL CREATE DATABASE redb" && touch /tmp/done && exec sleep infinity
        exit 1
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/done"]
      interval: 3s
      timeout: 3s
      retries: 40
