# RabbitMQ TLS / EXTERNAL / OAuth2 stand for redb.Route RabbitMQ tests.
listeners.tcp.default = 5672
listeners.ssl.default = 5671

ssl_options.cacertfile = /certs/ca.pem
ssl_options.certfile   = /certs/server.pem
ssl_options.keyfile    = /certs/server.key
ssl_options.verify     = verify_peer
ssl_options.fail_if_no_peer_cert = false

auth_mechanisms.1 = PLAIN
auth_mechanisms.2 = AMQPLAIN
auth_mechanisms.3 = EXTERNAL
ssl_cert_login_from = common_name

auth_backends.1 = rabbit_auth_backend_oauth2
auth_backends.2 = rabbit_auth_backend_internal

auth_oauth2.resource_server_id = rabbitmq
auth_oauth2.signing_keys.default = /certs/oauth-signing.pub.pem
auth_oauth2.default_key = default
auth_oauth2.verify_aud = false
auth_oauth2.preferred_username_claims.1 = sub

loopback_users = none
load_definitions = /etc/rabbitmq/definitions.json
