anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
dirmessage_enable=YES
xferlog_enable=YES
connect_from_port_20=YES
vsftpd_log_file=/proc/1/fd/1
listen=YES
seccomp_sandbox=NO
background=YES

# Chroot users into their home directory
chroot_local_user=YES
allow_writeable_chroot=YES

# Passive mode
pasv_enable=YES
pasv_addr_resolve=YES
pasv_address=127.0.0.1
pasv_min_port=21000
pasv_max_port=21010
