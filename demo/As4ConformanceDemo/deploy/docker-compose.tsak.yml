# ConformanceModule under Tsak: the stack image (worker + dashboard), in-memory storage, the module as a .tpkg in
# ./modules, the keys in ./keys. Nothing of a test account is in this file: copy .env.example to .env and fill it in.
#
#   docker compose -f docker-compose.tsak.yml up -d
#
# The container joins the network of the access point that plays the test driver, so the two reach each other by
# name: the driver posts to http://as4ct-tsak:4090/as4/sut and .../as4/controller. For the conformance testing
# service itself, publish port 4090 behind the reverse proxy that terminates TLS instead.
name: as4-conformance

services:
  tsak:
    image: ${TSAK_IMAGE:-redb-tsak-stack:4.3.0-net10}
    container_name: as4ct-tsak
    restart: ${AS4CT_RESTART:-no}                   # a stand is started by hand; the public access point: unless-stopped
    ports:
      - "${TSAK_WEB_BIND:-127.0.0.1}:${TSAK_WEB_PORT:-18085}:8085"     # dashboard; TSAK_WEB_BIND opens it to one interface
      - "127.0.0.1:${TSAK_API_PORT:-19090}:9090"     # management API
    environment:
      # ── Tsak ──
      - Tsak__Storage__Type=InMemory
      - Tsak__Modules__AssemblyPaths__0=/app/modules
      - Tsak__Auth__Enabled=true
      - Tsak__Auth__Secret=${TSAK_AUTH_SECRET:?TSAK_AUTH_SECRET required}
      - Tsak__Auth__Keys__0__Id=svc-tsak-web
      - Tsak__Auth__Keys__0__KeyHash=${TSAK_WEB_API_KEY_HASH:?TSAK_WEB_API_KEY_HASH required}
      - Tsak__Auth__Keys__0__Name=tsak-web-dashboard
      - Tsak__Auth__Keys__0__Roles=admin
      - Tsak__Web__AdminLogin=admin
      # The BCrypt hash of the dashboard password, not the password: nothing on the host gives the password back.
      - Tsak__Web__AdminPasswordHash=${TSAK_WEB_ADMIN_PASSWORD_HASH:?TSAK_WEB_ADMIN_PASSWORD_HASH required}
      # In-memory storage has no shared store to discover workers from: the dashboard is told its one worker, with
      # the key it calls the management API with (Tsak:Web:ServiceApiKey is read in cluster mode only).
      # Behind a reverse proxy that publishes the dashboard: the client address and scheme from X-Forwarded-*, so the
      # login throttle sees real clients and the auth cookie is Secure. Off when nothing proxies the dashboard.
      - Tsak__Web__TrustProxyHeaders=${TSAK_WEB_TRUST_PROXY_HEADERS:-false}
      - Tsak__Web__Mode=standalone
      - Tsak__Web__Nodes__0__Id=default
      - Tsak__Web__Nodes__0__Url=http://localhost:9090
      - Tsak__Web__Nodes__0__ApiKey=${TSAK_WEB_API_KEY:?TSAK_WEB_API_KEY required}
      # ── The module: what differs from ConformanceModule.config.json ──
      - Tsak__Contexts__as4-conformance__Override__TestDriver__Url=${AS4CT_TESTDRIVER_URL:?AS4CT_TESTDRIVER_URL required}
      - Tsak__Contexts__as4-conformance__Override__TestDriver__ControllerUrl=${AS4CT_TESTDRIVER_CONTROLLER_URL:?AS4CT_TESTDRIVER_CONTROLLER_URL required}
      - Tsak__Contexts__as4-conformance__Override__TestDriver__PartyId=${AS4CT_TESTDRIVER_PARTY:-test_driver}
      - Tsak__Contexts__as4-conformance__Override__TestDriver__ControllerPartyId=${AS4CT_TESTDRIVER_CONTROLLER_PARTY:-test_driver_sut_controller_domain}
      - Tsak__Contexts__as4-conformance__Override__TestDriver__Certificate=/app/keys/${AS4CT_TESTDRIVER_CERT_FILE:?AS4CT_TESTDRIVER_CERT_FILE required}
      # Optional, full paths in the container (empty = not set): the command channel's certificate, the authorities
      # a path token must chain to, and the authorities above the SUT certificate (";" between files).
      - Tsak__Contexts__as4-conformance__Override__TestDriver__ControllerCertificate=${AS4CT_TESTDRIVER_CONTROLLER_CERT:-}
      - Tsak__Contexts__as4-conformance__Override__TestDriver__TrustAnchors=${AS4CT_TESTDRIVER_TRUST_ANCHORS:-}
      - Tsak__Contexts__as4-conformance__Override__Sut__Chain=${AS4CT_SUT_CHAIN:-}
      - Tsak__Contexts__as4-conformance__Override__Sut__PartyId=${AS4CT_SUT_PARTY:-system_under_test}
      - Tsak__Contexts__as4-conformance__Override__Sut__ControllerPartyId=${AS4CT_CONTROLLER_PARTY:-sut_controller_domain}
      - Tsak__Contexts__as4-conformance__Override__Sut__Pfx=/app/keys/${AS4CT_SUT_PFX_FILE:?AS4CT_SUT_PFX_FILE required}
      - Tsak__Contexts__as4-conformance__Override__Sut__PfxPassword=${AS4CT_SUT_PFX_PASSWORD:?AS4CT_SUT_PFX_PASSWORD required}
      - Tsak__Contexts__as4-conformance__Override__Sut__HostName=${AS4CT_HOST_NAME:-redb.route}
      - Tsak__Contexts__as4-conformance__Override__Retry__Count=${AS4CT_RETRY_COUNT:-5}
      - Tsak__Contexts__as4-conformance__Override__Retry__DelaySeconds=${AS4CT_RETRY_DELAY_SECONDS:-20}
    volumes:
      - ./modules:/app/modules
      - ./keys:/app/keys:ro
      - as4ct-logs:/app/worker/Logs
    networks: [stand]

volumes:
  as4ct-logs:

networks:
  stand:
    name: ${AS4CT_NETWORK:?AS4CT_NETWORK required}
    external: true
